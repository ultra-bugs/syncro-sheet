name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # NOTE: a `pint --test` job is intentionally omitted. The repository has no
  # pint.json and its committed style predates Pint's default preset, so running
  # the default preset would reformat ~20 pre-existing files. Standardizing on
  # Pint (adding a pint.json + a style job here) is tracked as a separate task.
